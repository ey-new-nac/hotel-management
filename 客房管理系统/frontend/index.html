<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客房管理系统 - 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.container { width: 420px; }
.header {
    text-align: center; color: #fff; margin-bottom: 30px;
}
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header p { color: #8892b0; font-size: 14px; }
.tabs {
    display: flex; background: rgba(255,255,255,0.1); border-radius: 10px 10px 0 0; overflow: hidden;
}
.tab {
    flex: 1; text-align: center; padding: 14px; color: #8892b0; cursor: pointer;
    font-size: 15px; transition: all 0.3s;
}
.tab.active { background: #fff; color: #0f3460; font-weight: bold; }
.form-box {
    background: #fff; padding: 35px 30px; border-radius: 0 0 10px 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.form-group { margin-bottom: 20px; }
.form-group label { display: block; margin-bottom: 6px; color: #333; font-size: 14px; font-weight: 500; }
.form-group input, .form-group select {
    width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; transition: border-color 0.3s; outline: none;
}
.form-group input:focus { border-color: #0f3460; }
.btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px;
    font-weight: bold; cursor: pointer; transition: all 0.3s; color: #fff;
}
.btn-primary { background: linear-gradient(135deg, #0f3460, #1a5276); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(15,52,96,0.4); }
.hidden { display: none; }
.msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
.msg-error { background: #fee2e2; color: #991b1b; }
.msg-success { background: #d1fae5; color: #065f46; }
.link-text { text-align: center; margin-top: 15px; font-size: 13px; color: #6b7280; }
.link-text a { color: #0f3460; cursor: pointer; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>客房管理系统</h1>
        <p>Hotel Room Management System</p>
    </div>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('staff')">员工登录</div>
        <div class="tab" onclick="switchTab('customer')">客户登录</div>
    </div>
    <div class="form-box">
        <div id="msg"></div>

        <!-- 员工登录表单 -->
        <form id="staffForm" onsubmit="staffLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="staffUser" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="staffPass" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
            <div class="link-text" style="margin-top:20px;color:#8892b0;font-size:12px;">
                测试账号：admin / admin123 (管理员)<br>
                manager / manager123 (经理) | front1 / front123 (前台)
            </div>
        </form>

        <!-- 客户登录表单 -->
        <form id="customerForm" class="hidden" onsubmit="customerLogin(event)">
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="customerPhone" placeholder="请输入注册手机号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="customerPass" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
            <div class="link-text">
                还没有账号？<a onclick="goRegister()">立即注册</a>
            </div>
        </form>
    </div>
</div>

<script>
const API = 'http://localhost:5000';

function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.className = `msg msg-${type}`;
    el.textContent = text;
}

function switchTab(type) {
    const tabs = document.querySelectorAll('.tab');
    tabs[0].classList.toggle('active', type === 'staff');
    tabs[1].classList.toggle('active', type === 'customer');
    document.getElementById('staffForm').classList.toggle('hidden', type !== 'staff');
    document.getElementById('customerForm').classList.toggle('hidden', type !== 'customer');
    document.getElementById('msg').className = '';
    document.getElementById('msg').textContent = '';
    document.getElementById('msg').style.display = type === 'staff' ? 'block' : 'block';
}

async function staffLogin(e) {
    e.preventDefault();
    const username = document.getElementById('staffUser').value.trim();
    const password = document.getElementById('staffPass').value;
    try {
        const res = await fetch(`${API}/api/login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include', body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code === 200) {
            showMsg('登录成功，正在跳转...', 'success');
            setTimeout(() => {
                const role = data.data.role;
                if (role === 'admin') location.href = 'admin.html';
                else if (role === 'manager') location.href = 'manager.html';
                else location.href = 'front_desk.html';
            }, 500);
        } else {
            showMsg(data.msg, 'error');
        }
    } catch (err) {
        showMsg('网络错误，请检查后端是否启动', 'error');
    }
}

async function customerLogin(e) {
    e.preventDefault();
    const phone = document.getElementById('customerPhone').value.trim();
    const password = document.getElementById('customerPass').value;
    try {
        const res = await fetch(`${API}/api/customer/login`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            credentials: 'include', body: JSON.stringify({ phone, password })
        });
        const data = await res.json();
        if (data.code === 200) {
            showMsg('登录成功，正在跳转...', 'success');
            setTimeout(() => { location.href = 'customer.html'; }, 500);
        } else {
            showMsg(data.msg, 'error');
        }
    } catch (err) {
        showMsg('网络错误，请检查后端是否启动', 'error');
    }
}

function goRegister() {
    location.href = 'register.html';
}
</script>
</body>
</html>
