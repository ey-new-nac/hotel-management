<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户注册 - 客房管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.container {
    width: 420px; background: #fff; border-radius: 10px; padding: 40px 35px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.container h2 { text-align: center; color: #0f3460; margin-bottom: 8px; font-size: 24px; }
.container p { text-align: center; color: #6b7280; margin-bottom: 25px; font-size: 14px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; margin-bottom: 6px; color: #333; font-size: 14px; font-weight: 500; }
.form-group input, .form-group select {
    width: 100%; padding: 11px 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14px; outline: none; transition: border-color 0.3s;
}
.form-group input:focus { border-color: #0f3460; }
.btn {
    width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px;
    font-weight: bold; cursor: pointer; color: #fff; transition: all 0.3s;
}
.btn-primary { background: linear-gradient(135deg, #0f3460, #1a5276); margin-top: 8px; }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(15,52,96,0.4); }
.msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
.msg-error { background: #fee2e2; color: #991b1b; }
.msg-success { background: #d1fae5; color: #065f46; }
.back { text-align: center; margin-top: 20px; font-size: 13px; }
.back a { color: #0f3460; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
    <h2>客户注册</h2>
    <p>注册后即可在线预订房间</p>
    <div id="msg"></div>
    <form onsubmit="register(event)">
        <div class="form-group">
            <label>姓名 *</label>
            <input type="text" id="name" placeholder="请输入真实姓名" required>
        </div>
        <div class="form-group">
            <label>性别</label>
            <select id="gender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label>手机号 *</label>
            <input type="text" id="phone" placeholder="请输入手机号（用于登录）" required>
        </div>
        <div class="form-group">
            <label>证件号码</label>
            <input type="text" id="idCard" placeholder="请输入身份证号">
        </div>
        <div class="form-group">
            <label>登录密码 *</label>
            <input type="password" id="password" placeholder="请设置密码" required>
        </div>
        <button type="submit" class="btn btn-primary">注 册</button>
    </form>
    <div class="back"><a href="index.html">已有账号？返回登录</a></div>
</div>

<script>
const API = 'http://localhost:5000';

function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.className = `msg msg-${type}`;
    el.textContent = text;
}

async function register(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const gender = document.getElementById('gender').value;
    const idCard = document.getElementById('idCard').value.trim();

    if (password.length < 6) {
        showMsg('密码长度至少6位', 'error'); return;
    }

    try {
        const res = await fetch(`${API}/api/customer/register`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, password, gender, id_card: idCard })
        });
        const data = await res.json();
        if (data.code === 200) {
            showMsg('注册成功！即将跳转到登录页...', 'success');
            setTimeout(() => { location.href = 'index.html'; }, 1500);
        } else {
            showMsg(data.msg, 'error');
        }
    } catch (err) {
        showMsg('网络错误，请检查后端是否启动', 'error');
    }
}
</script>
</body>
</html>
